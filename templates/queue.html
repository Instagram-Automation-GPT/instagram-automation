{% extends 'base.html' %}
{% load static %}

{% block title %}Queue Manager{% endblock %}

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{% static 'css/queue.css' %}">
{% endblock %}

{% block content %}
<!-- Optional page header (remove if base.html already has a global header) -->
<header class="page-header">
  <div class="page-header__inner">
    <h1 class="page-header__title">Queue Manager</h1>
    <button class="btn btn-primary" onclick="refreshQueue()">
      <i class="fas fa-sync-alt mr-2"></i>Refresh
    </button>
  </div>
</header>

<main class="main-content">
  <div class="container">
    <div class="card">
      <!-- Grid list -->
      <div id="queueList" class="queue-list">
        <!-- Items populated by JS -->
      </div>
    </div>
  </div>
</main>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/queue.js' %}"></script>
{% endblock %}
